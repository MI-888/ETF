name: Update ETF dividend report

on:
  schedule:
    # 18:30 台北時間(UTC+8) = 10:30 UTC,週一到週五(交易日近似值,不排除國定假日)
    # 延後至收盤後約5小時,避開 TWSE STOCK_DAY_ALL 開放資料尚未更新當日收盤價的空窗期
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data
        run: python scripts/fetch_data.py

      - name: Build report page
        run: python scripts/build_report.py

      - name: Commit and push if changed
        run: |
          git config user.name "etf-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/index.html
          git diff --cached --quiet || git commit -m "Auto-update ETF report"
          git push
